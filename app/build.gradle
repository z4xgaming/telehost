plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.hopweb.telehost'
    compileSdk 34

    defaultConfig {
        applicationId "com.hopweb.telehost"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            buildPython "python3"
            pip {
                // ===== TELEGRAM =====
                install "python-telegram-bot==20.7"
                install "pyrogram==2.0.106"
                install "telethon==1.34.0"
                install "aiogram==3.4.1"

                // ===== HTTP =====
                install "requests==2.31.0"
                install "httpx==0.26.0"
                install "aiohttp==3.9.1"
                install "urllib3==2.1.0"

                // ===== JWT & AUTH =====
                install "PyJWT==2.8.0"
                install "python-jose==3.3.0"
                install "passlib==1.7.4"
                install "bcrypt==4.1.2"

                // ===== DATABASE =====
                install "pymongo==4.6.1"
                install "redis==5.0.1"
                install "sqlalchemy==2.0.25"
                install "aiosqlite==0.19.0"

                // ===== UTILS (pure Python only) =====
                install "python-dotenv==1.0.0"
                install "pytz==2023.3"
                install "colorama==0.4.6"
                install "psutil==5.9.8"
                install "loguru==0.7.2"
                install "orjson==3.9.12"
                install "ujson==5.9.0"
                install "websockets==12.0"

                // ===== CRYPTO =====
                install "cryptography==42.0.2"
                install "pycryptodome==3.20.0"
            }
        }
    }

    buildFeatures { viewBinding true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
